<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Viewport Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #08080a;
  --surface: #0e0e12;
  --surface-raised: #141418;
  --surface-glass: rgba(14,14,18,0.72);
  --border: rgba(255,255,255,0.06);
  --border-active: rgba(255,255,255,0.1);
  --border-glow: rgba(56,189,248,0.2);
  --text: #eaeaed;
  --text-secondary: #9898a4;
  --text-muted: #5c5c6e;
  --text-faint: #33334a;
  --accent: #38bdf8;
  --accent-dim: rgba(56,189,248,0.08);
  --accent-mid: rgba(56,189,248,0.15);
  --pass: #34d399;
  --pass-dim: rgba(52,211,153,0.1);
  --warn: #fbbf24;
  --warn-dim: rgba(251,191,36,0.1);
  --fail: #fb7185;
  --fail-dim: rgba(251,113,133,0.1);
  --radius: 8px;
  --radius-sm: 5px;
  --font-sans: "DM Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex; flex-direction: column; overflow: hidden;
  /* Subtle noise texture */
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56,189,248,0.03), transparent),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
}

/* --- Entrance animations --- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); }
  50% { box-shadow: 0 0 12px 2px rgba(56,189,248,0.15); }
}

/* --- TOPBAR --- */
.topbar {
  position: sticky; top: 0; z-index: 200;
  background: var(--surface-glass);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  padding: 0 1.25rem;
  display: flex; align-items: center; gap: 1rem;
  height: 48px;
  animation: fadeIn 0.3s ease-out;
}

.topbar h1 {
  font-size: 0.8125rem;
  font-weight: 600;
  white-space: nowrap;
  letter-spacing: -0.01em;
  color: var(--text);
  display: flex; align-items: center; gap: 0.5rem;
}
.topbar h1::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 2px;
  background: var(--accent);
  box-shadow: 0 0 8px rgba(56,189,248,0.4);
}

.topbar-right { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }

.counts { display: flex; gap: 0.625rem; font-size: 0.6875rem; font-family: var(--font-mono); font-weight: 500; }
.counts span { display: flex; align-items: center; gap: 0.3rem; color: var(--text-muted); }
.counts span .num { color: var(--text-secondary); }

.dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}
.dot.fail { color: var(--fail); background: var(--fail); }
.dot.warn { color: var(--warn); background: var(--warn); }
.dot.pass { color: var(--pass); background: var(--pass); }

.btn {
  padding: 0.4rem 0.875rem;
  font-size: 0.6875rem;
  font-weight: 500;
  font-family: var(--font-sans);
  border: 1px solid var(--border-active);
  background: var(--surface-raised);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  min-width: 110px;
  text-align: center;
  letter-spacing: 0.01em;
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(56,189,248,0.08), transparent 60%);
  opacity: 0;
  transition: opacity 0.2s;
}
.btn:hover {
  border-color: var(--accent);
  color: var(--text);
  background: var(--surface-raised);
}
.btn:hover::after { opacity: 1; }
.btn:active { transform: scale(0.97); }
.btn.running {
  color: var(--accent);
  border-color: var(--accent);
  opacity: 0.8;
  pointer-events: none;
  animation: pulse-glow 1.5s ease-in-out infinite;
  background: linear-gradient(90deg, var(--surface-raised), var(--accent-dim), var(--surface-raised));
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite, pulse-glow 1.5s ease-in-out infinite;
}

/* --- FILTER TABS --- */
.filters {
  display: flex; gap: 2px; padding: 0.375rem 1.25rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  animation: fadeIn 0.3s ease-out 0.05s both;
}
.filters button {
  font-family: var(--font-mono);
  font-size: 0.625rem;
  font-weight: 500;
  padding: 0.3rem 0.625rem;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: none;
  color: var(--text-faint);
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.02em;
  text-transform: lowercase;
}
.filters button:hover {
  color: var(--text-secondary);
  background: rgba(255,255,255,0.02);
}
.filters button.on {
  color: var(--accent);
  background: var(--accent-dim);
  border-color: rgba(56,189,248,0.12);
}

/* --- LAYOUT --- */
.main { display: flex; flex: 1; overflow: hidden; }

/* --- CARDS PANEL --- */
.cards-panel {
  width: 280px; min-width: 240px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: var(--surface);
  display: flex; flex-direction: column;
  animation: slideInLeft 0.3s ease-out 0.1s both;
}
.cards-panel::-webkit-scrollbar { width: 4px; }
.cards-panel::-webkit-scrollbar-track { background: transparent; }
.cards-panel::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 4px; }

.card {
  padding: 0.75rem 0.875rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex; align-items: flex-start; gap: 0.625rem;
  position: relative;
}
.card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: transparent;
  transition: background 0.15s ease;
}
.card:hover {
  background: rgba(255,255,255,0.018);
}
.card:hover::before {
  background: var(--border-active);
}
.card.selected {
  background: var(--accent-dim);
}
.card.selected::before {
  background: var(--accent);
  box-shadow: 0 0 8px rgba(56,189,248,0.3);
}

.card-badge {
  font-size: 0.5625rem;
  font-weight: 600;
  font-family: var(--font-mono);
  text-transform: uppercase;
  padding: 0.15rem 0.375rem;
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 0.1rem;
  letter-spacing: 0.04em;
}
.card-badge.fail { background: var(--fail-dim); color: var(--fail); }
.card-badge.warn { background: var(--warn-dim); color: var(--warn); }
.card-badge.pass { background: var(--pass-dim); color: var(--pass); }

.card-info { flex: 1; min-width: 0; }
.card-label {
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-secondary);
  line-height: 1.35;
  letter-spacing: -0.005em;
}
.card-text {
  font-size: 0.625rem;
  font-family: var(--font-mono);
  color: var(--text-faint);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 0.2rem;
  opacity: 0.7;
}
.card-meta {
  font-size: 0.5625rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
  font-family: var(--font-mono);
}

/* --- CANVAS PANEL --- */
.canvas-panel {
  display: flex; flex-direction: column; flex: 1; overflow: hidden;
  animation: fadeIn 0.4s ease-out 0.15s both;
}
.canvas-header {
  padding: 0.625rem 1.125rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 0.75rem;
  background: var(--surface);
  min-height: 44px;
}
.canvas-title {
  font-size: 0.8125rem;
  font-weight: 600;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.canvas-nav {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.6875rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.canvas-nav button {
  width: 28px; height: 28px; padding: 0;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s ease;
  font-size: 0.75rem;
  font-family: var(--font-sans);
}
.canvas-nav button:hover {
  border-color: var(--accent);
  color: var(--text);
  background: var(--accent-dim);
}
.canvas-nav button:disabled { opacity: 0.2; cursor: not-allowed; }
.canvas-nav button:disabled:hover { border-color: var(--border); color: var(--text-secondary); background: var(--surface-raised); }

/* --- VIEWPORT --- */
.canvas-viewport {
  flex: 1; overflow: auto;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 1rem;
  background:
    radial-gradient(circle at 50% 50%, rgba(56,189,248,0.015) 0%, transparent 70%),
    repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(255,255,255,0.012) 19px, rgba(255,255,255,0.012) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(255,255,255,0.012) 19px, rgba(255,255,255,0.012) 20px),
    var(--bg);
  position: relative;
}
.canvas-viewport::-webkit-scrollbar { width: 8px; height: 8px; }
.canvas-viewport::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 999px; }

.viewport-empty {
  color: var(--text-faint);
  font-size: 0.8125rem;
  text-align: center;
  line-height: 1.7;
  font-weight: 400;
  letter-spacing: -0.005em;
}
.viewport-empty::before {
  content: "⬡";
  display: block;
  font-size: 1.75rem;
  margin-bottom: 0.5rem;
  opacity: 0.25;
}

.viewport-frame {
  position: relative;
  background: var(--bg);
  overflow: hidden;
  border-radius: var(--radius);
  box-shadow:
    0 0 0 1px var(--border),
    0 4px 24px rgba(0,0,0,0.4),
    0 1px 3px rgba(0,0,0,0.3);
  transition: box-shadow 0.3s ease;
}
.viewport-frame:hover {
  box-shadow:
    0 0 0 1px var(--border-active),
    0 8px 32px rgba(0,0,0,0.5),
    0 2px 6px rgba(0,0,0,0.3);
}
.viewport-frame iframe { border: none; display: block; transform-origin: top left; }

/* --- DEVICE BAR --- */
.device-bar {
  display: flex; gap: 0.375rem; padding: 0.5rem 1.125rem;
  border-top: 1px solid var(--border);
  background: var(--surface);
  overflow-x: auto;
  align-items: center;
}
.device-bar::-webkit-scrollbar { height: 3px; }
.device-bar::-webkit-scrollbar-track { background: transparent; }
.device-bar::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }

.device-btn {
  padding: 0.35rem 0.625rem;
  font-family: var(--font-mono);
  font-size: 0.5625rem;
  font-weight: 500;
  white-space: nowrap;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-faint);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  flex-shrink: 0;
  letter-spacing: 0.01em;
}
.device-btn:hover {
  color: var(--text-secondary);
  border-color: var(--border-active);
  background: rgba(255,255,255,0.02);
}
.device-btn.active {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
  box-shadow: 0 0 10px rgba(56,189,248,0.25);
}
.device-btn .status-dot {
  display: inline-block; width: 5px; height: 5px;
  border-radius: 50%; margin-right: 0.3rem; vertical-align: middle;
  box-shadow: 0 0 4px currentColor;
}

/* --- HIDDEN IFRAME --- */
#measure-frame { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* --- DEVICE TYPE BADGE --- */
.device-type-badge {
  font-size: 0.5rem;
  font-weight: 600;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.15rem 0.4rem;
  border-radius: 3px;
  margin-left: 0.5rem;
  flex-shrink: 0;
}
.device-type-badge.touch { background: rgba(129,140,248,0.12); color: #a5b4fc; }
.device-type-badge.mouse { background: rgba(156,163,175,0.08); color: #9ca3af; }

/* --- TOUCH OVERLAY --- */
.touch-overlay {
  position: absolute; inset: 0; z-index: 10;
  cursor: none; touch-action: none;
}
.touch-cursor {
  position: fixed; pointer-events: none; z-index: 100;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(56,189,248,0.1);
  border: 1.5px solid rgba(56,189,248,0.3);
  transform: translate(-50%, -50%);
  transition: transform 0.06s ease-out, background 0.1s, border-color 0.1s;
  display: none;
}
.touch-cursor.visible { display: block; }
.touch-cursor.pressed {
  transform: translate(-50%, -50%) scale(0.78);
  background: rgba(56,189,248,0.2);
  border-color: rgba(56,189,248,0.5);
}

.tap-ripple {
  position: fixed; pointer-events: none; z-index: 99;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1.5px solid rgba(56,189,248,0.3);
  transform: translate(-50%, -50%) scale(0);
  animation: ripple-expand 0.45s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}
@keyframes ripple-expand {
  0%   { transform: translate(-50%, -50%) scale(0); opacity: 0.7; }
  100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
}

/* --- MOUSE OVERLAY --- */
.mouse-overlay { pointer-events: none; }

/* --- Card entrance stagger --- */
.card { animation: fadeUp 0.2s ease-out both; }
.card:nth-child(1)  { animation-delay: 0.02s; }
.card:nth-child(2)  { animation-delay: 0.04s; }
.card:nth-child(3)  { animation-delay: 0.06s; }
.card:nth-child(4)  { animation-delay: 0.08s; }
.card:nth-child(5)  { animation-delay: 0.1s; }
.card:nth-child(6)  { animation-delay: 0.12s; }
.card:nth-child(7)  { animation-delay: 0.14s; }
.card:nth-child(8)  { animation-delay: 0.16s; }
.card:nth-child(9)  { animation-delay: 0.18s; }
.card:nth-child(10) { animation-delay: 0.2s; }
.card:nth-child(n+11) { animation-delay: 0.22s; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Viewport Preview</h1>
  <div class="topbar-right">
    <div class="counts" id="counts"></div>
    <button class="btn" id="runBtn">Generate Report</button>
  </div>
</div>

<div class="filters" id="filters">
  <button class="on" data-filter="fail">fail</button>
  <button data-filter="warn">warn</button>
  <button data-filter="pass">pass</button>
  <button data-filter="all">all</button>
</div>

<div class="main">
  <div class="cards-panel" id="cardsList"></div>

  <div class="canvas-panel">
    <div class="canvas-header">
      <div class="canvas-title" id="canvasTitle">Select a check to preview</div>
      <div class="canvas-nav">
        <button id="prevDevice" disabled>&larr;</button>
        <span id="deviceLabel"></span>
        <button id="nextDevice" disabled>&rarr;</button>
      </div>
    </div>
    <div class="canvas-viewport" id="viewport">
      <div class="viewport-empty">Select a check to see<br/>how it renders on each device</div>
    </div>
    <div class="device-bar" id="deviceBar"></div>
  </div>
</div>

<script type="module">
import { prepare, layout } from "https://esm.sh/@chenglou/pretext@0.0.4";

const RUNNER = "RUNNER_URL";
const TARGET = "TARGET_URL";

let data = null;
let activeFilter = "fail";
let selectedIdx = null;
let deviceIdx = 0;
let fontsLoaded = false;
let frameEl = null;
let overlayEl = null;
let currentFramePage = null;
let currentCheckKey = null;
const pageScrollPositions = new Map();

// --- Device input type classification ---
// Touch: mobile + tablet viewports. Mouse: desktop viewports.
const TOUCH_THRESHOLD = 1024;
function inputTypeForWidth(w) { return w <= TOUCH_THRESHOLD ? "touch" : "mouse"; }

// --- Touch cursor element (persistent, reused across renders) ---
const touchCursorEl = document.createElement("div");
touchCursorEl.className = "touch-cursor";
document.body.appendChild(touchCursorEl);

function setupTouchOverlay(overlayEl, frameEl, scale) {
  let pressed = false;
  let dragStart = null;
  let scrollStart = null;

  // --- Visual cursor (finger dot) tracking ---
  // This only drives the visual indicator — NO events are forwarded on hover.
  // Touch devices have zero hover capability: finger proximity is not
  // exposed as a browser event (capacitive sensing stays in firmware).
  overlayEl.addEventListener("mouseenter", () => {
    touchCursorEl.classList.add("visible");
  });
  overlayEl.addEventListener("mouseleave", () => {
    touchCursorEl.classList.remove("visible", "pressed");
    pressed = false;
    dragStart = null;
    scrollStart = null;
  });
  overlayEl.addEventListener("mousemove", (e) => {
    touchCursorEl.style.left = e.clientX + "px";
    touchCursorEl.style.top = e.clientY + "px";
    // Drag-to-scroll while pressed (touch pan simulation)
    if (pressed && dragStart && scrollStart) {
      const dx = (dragStart.x - e.clientX) / scale;
      const dy = (dragStart.y - e.clientY) / scale;
      try { frameEl.contentWindow.scrollTo(scrollStart.x + dx, scrollStart.y + dy); } catch {}
      // Forward touchmove into iframe
      forwardTouchToIframe(e, frameEl, scale, "touchmove");
    }
    // IMPORTANT: no mousemove/pointerover/pointermove forwarded — no hover on touch.
  });

  // --- Touch-down (finger contact) ---
  overlayEl.addEventListener("mousedown", (e) => {
    pressed = true;
    touchCursorEl.classList.add("pressed");
    dragStart = { x: e.clientX, y: e.clientY };
    try { scrollStart = { x: frameEl.contentWindow.scrollX, y: frameEl.contentWindow.scrollY }; } catch { scrollStart = null; }
    forwardTouchToIframe(e, frameEl, scale, "touchstart");
  });

  // --- Touch-up (finger lifts) ---
  overlayEl.addEventListener("mouseup", (e) => {
    if (!pressed) return;
    pressed = false;
    touchCursorEl.classList.remove("pressed");
    forwardTouchToIframe(e, frameEl, scale, "touchend");
    dragStart = null;
    scrollStart = null;
    // Tap ripple — visual feedback for touch tap
    const ripple = document.createElement("div");
    ripple.className = "tap-ripple";
    ripple.style.left = e.clientX + "px";
    ripple.style.top = e.clientY + "px";
    document.body.appendChild(ripple);
    ripple.addEventListener("animationend", () => ripple.remove());
  });

  // --- Block all hover-generating events from reaching the iframe ---
  // The overlay intercepts these; nothing hover-related propagates.
  for (const evt of ["mouseover", "mouseenter", "mousemove", "pointerover", "pointerenter", "pointermove"]) {
    overlayEl.addEventListener(evt, (e) => { e.stopPropagation(); });
  }

  // --- Wheel → scroll the iframe content ---
  // Drop pointer-events on overlay so the wheel event falls through to the
  // iframe natively. Re-enable on next frame. This is the only reliable way
  // to scroll a (potentially cross-origin) iframe from an overlay.
  overlayEl.addEventListener("wheel", (e) => {
    e.preventDefault();
    try {
      frameEl.contentWindow.scrollBy({
        left: e.deltaX / scale,
        top: e.deltaY / scale,
        behavior: "instant",
      });
    } catch {}
  });
}

// Dispatch real TouchEvent into iframe (same-origin) or degrade silently (cross-origin).
// Touch events never trigger :hover — this is the key difference from PointerEvent/MouseEvent.
function forwardTouchToIframe(mouseEvt, frameEl, scale, type) {
  try {
    const doc = frameEl.contentDocument;
    if (!doc) return;
    const rect = frameEl.getBoundingClientRect();
    const x = (mouseEvt.clientX - rect.left) / scale;
    const y = (mouseEvt.clientY - rect.top) / scale;
    const target = doc.elementFromPoint(x, y);
    if (!target) return;

    const touch = new Touch({
      identifier: 0,
      target: target,
      clientX: x,
      clientY: y,
      pageX: x + (doc.defaultView?.scrollX || 0),
      pageY: y + (doc.defaultView?.scrollY || 0),
    });

    const touchEvt = new TouchEvent(type, {
      bubbles: true,
      cancelable: true,
      touches: type === "touchend" ? [] : [touch],
      targetTouches: type === "touchend" ? [] : [touch],
      changedTouches: [touch],
    });
    target.dispatchEvent(touchEvt);
  } catch { /* cross-origin — visual-only simulation */ }
}

const countsEl = document.getElementById("counts");
const cardsEl = document.getElementById("cardsList");
const titleEl = document.getElementById("canvasTitle");
const viewportEl = document.getElementById("viewport");
const deviceBarEl = document.getElementById("deviceBar");
const deviceLabelEl = document.getElementById("deviceLabel");
const prevBtn = document.getElementById("prevDevice");
const nextBtn = document.getElementById("nextDevice");
const runBtn = document.getElementById("runBtn");

function selectionKey(check) {
  return check.page + "::" + check.label + "::" + check.text;
}

function normalizeText(value) {
  return (value || "").replace(/\s+/g, " ").trim().toLowerCase();
}

function saveCurrentScrollPosition() {
  if (!frameEl || !currentFramePage) return;
  try {
    pageScrollPositions.set(currentFramePage, {
      x: frameEl.contentWindow.scrollX,
      y: frameEl.contentWindow.scrollY,
    });
  } catch {}
}

function restoreScrollPosition(page) {
  if (!frameEl) return false;
  const saved = pageScrollPositions.get(page);
  if (!saved) return false;
  try {
    frameEl.contentWindow.scrollTo(saved.x, saved.y);
    return true;
  } catch {
    return false;
  }
}

function findBestMatchElement(doc, targetText) {
  const wanted = normalizeText(targetText);
  if (!wanted) return null;

  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_ELEMENT);
  let partial = null;

  while (walker.nextNode()) {
    const el = walker.currentNode;
    if (!(el instanceof HTMLElement)) continue;
    const text = normalizeText(el.innerText || el.textContent || "");
    if (!text) continue;
    if (text === wanted) return el;
    if (!partial && text.includes(wanted)) partial = el;
  }

  return partial;
}

function scrollCheckIntoView(check) {
  if (!frameEl) return false;
  try {
    const doc = frameEl.contentDocument;
    if (!doc?.body) return false;
    const match = findBestMatchElement(doc, check.text);
    if (!match) return false;
    const top = Math.max(0, match.getBoundingClientRect().top + frameEl.contentWindow.scrollY - 120);
    frameEl.contentWindow.scrollTo({ top, behavior: "instant" });
    return true;
  } catch {
    return false;
  }
}

function syncSelectedCard() {
  cardsEl.querySelectorAll(".card").forEach(card => {
    const isSelected = parseInt(card.dataset.idx) === selectedIdx;
    card.classList.toggle("selected", isSelected);
    if (isSelected) {
      card.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  });
}

function ensureViewportFrame() {
  if (frameEl && overlayEl) return;

  viewportEl.innerHTML =
    '<div class="viewport-frame">' +
      '<iframe loading="lazy"></iframe>' +
      '<div class="mouse-overlay"></div>' +
    '</div>';

  frameEl = viewportEl.querySelector("iframe");
  overlayEl = viewportEl.querySelector(".viewport-frame > div");
}

function updateViewportFrame(check, dev) {
  ensureViewportFrame();

  const vpRect = viewportEl.getBoundingClientRect();
  const maxW = Math.max(320, vpRect.width - 32);
  const maxH = Math.max(480, vpRect.height - 32);
  const scale = Math.min(1, maxW / dev.width, maxH / 900);
  const scaledW = Math.round(dev.width * scale);
  const scaledH = Math.round(900 * scale);
  const devInputType = inputTypeForWidth(dev.width);

  const frameWrap = viewportEl.querySelector(".viewport-frame");
  frameWrap.style.width = scaledW + "px";
  frameWrap.style.height = scaledH + "px";

  frameEl.style.width = dev.width + "px";
  frameEl.style.height = "900px";
  frameEl.style.transform = "scale(" + scale + ")";

  const nextOverlay = document.createElement("div");
  nextOverlay.className = devInputType === "touch" ? "touch-overlay" : "mouse-overlay";
  overlayEl.replaceWith(nextOverlay);
  overlayEl = nextOverlay;

  if (devInputType === "touch") {
    setupTouchOverlay(overlayEl, frameEl, scale);
  } else {
    touchCursorEl.classList.remove("visible");
  }

  return { devInputType };
}

// --- Load fonts + Google Fonts link on first config fetch ---
async function ensureFonts(config) {
  if (fontsLoaded) return;
  if (config.googleFontsUrl) {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = config.googleFontsUrl;
    document.head.appendChild(link);
  }
  const fontFaces = new Set();
  for (const ck of config.checks) {
    fontFaces.add(ck.fontWeight + ' 16px "' + ck.fontFamily + '"');
  }
  await Promise.all([...fontFaces].map(f => document.fonts.load(f)));
  fontsLoaded = true;
}

// --- Run pretext measurement locally in the browser ---
function runMeasurement(config) {
  const { breakpoints, checks } = config;
  const results = [];

  for (const ck of checks) {
    const lh = ck.lineHeight || 1.4;
    const dsk = ck.desktopResolved;
    const dskFontStr = ck.fontWeight + " " + dsk.fontSize + " " + ck.fontFamily;
    const dskLh = parseFloat(dsk.fontSize) * lh;
    const dskPrep = prepare(ck.text, dskFontStr);

    let baselineLines;
    if (ck.noWrap) {
      baselineLines = 1;
    } else {
      const dskResult = layout(dskPrep, dsk.containerWidth, dskLh);
      baselineLines = dskResult.lineCount;
    }

    const devices = [];
    for (let i = 0; i < breakpoints.length; i++) {
      const bp = breakpoints[i];
      const r = ck.resolved[i];
      const fontStr = ck.fontWeight + " " + r.fontSize + " " + ck.fontFamily;
      const bpLh = parseFloat(r.fontSize) * lh;

      let lc = 0, tw = 0, st = "PASS";
      try {
        const p = prepare(ck.text, fontStr);
        if (ck.noWrap) {
          const singleLine = layout(p, 99999, bpLh);
          tw = Math.round(singleLine.width || 0);
          lc = 1;
          st = tw > r.containerWidth ? "FAIL" : tw > r.containerWidth * 0.9 ? "WARN" : "PASS";
        } else {
          const result = layout(p, r.containerWidth, bpLh);
          lc = result.lineCount;
          const drift = lc - baselineLines;
          st = drift <= 0 ? "PASS" : drift === 1 ? "WARN" : "FAIL";
        }
      } catch (e) { st = "FAIL"; lc = -1; }

      devices.push({
        name: bp.name, width: bp.width, fontSize: r.fontSize,
        containerWidth: r.containerWidth, lineCount: lc,
        baselineLines, status: st, textWidth: tw, noWrap: !!ck.noWrap,
      });
    }

    const worst = devices.some(d => d.status === "FAIL") ? "FAIL"
      : devices.some(d => d.status === "WARN") ? "WARN" : "PASS";

    results.push({
      label: ck.label, text: ck.text, page: ck.page || "/",
      fontFamily: ck.fontFamily, baselineLines, worst, devices,
    });
  }

  results.sort((a, b) => ({ FAIL: 0, WARN: 1, PASS: 2 }[a.worst]) - ({ FAIL: 0, WARN: 1, PASS: 2 }[b.worst]));

  const fc = results.filter(r => r.worst === "FAIL").length;
  const wc = results.filter(r => r.worst === "WARN").length;
  const pc = results.filter(r => r.worst === "PASS").length;

  return {
    summary: { fail: fc, warn: wc, pass: pc, total: results.length, breakpoints: breakpoints.length },
    results,
  };
}

// --- Generate Report ---
runBtn.addEventListener("click", async () => {
  runBtn.textContent = "Measuring...";
  runBtn.classList.add("running");

  try {
    const resp = await fetch("http://" + RUNNER + "/api/config");
    const config = await resp.json();
    await ensureFonts(config);
    data = runMeasurement(config);

    // Cache results on server too
    fetch("http://" + RUNNER + "/api/results", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    }).catch(() => {});

    render();
  } catch (e) {
    countsEl.innerHTML = '<span style="color:var(--fail)">Error: ' + e.message + '</span>';
  }

  runBtn.textContent = "Generate Report";
  runBtn.classList.remove("running");
});

// --- Filters ---
document.getElementById("filters").addEventListener("click", (e) => {
  if (!e.target.dataset.filter) return;
  activeFilter = e.target.dataset.filter;
  document.querySelectorAll(".filters button").forEach(b => b.classList.toggle("on", b.dataset.filter === activeFilter));
  selectedIdx = null;
  deviceIdx = 0;
  render();
});

// --- Render ---
function filtered() {
  if (!data) return [];
  if (activeFilter === "all") return data.results;
  return data.results.filter(r => r.worst === activeFilter.toUpperCase());
}

function render() {
  if (!data) return;
  const { summary } = data;

  countsEl.innerHTML =
    '<span><span class="dot fail"></span>' + summary.fail + '</span>' +
    '<span><span class="dot warn"></span>' + summary.warn + '</span>' +
    '<span><span class="dot pass"></span>' + summary.pass + '</span>';

  const list = filtered();
  cardsEl.innerHTML = list.map((r, i) => {
    const failDevices = r.devices.filter(d => d.status !== "PASS").length;
    return '<div class="card' + (i === selectedIdx ? ' selected' : '') + '" data-idx="' + i + '">' +
      '<span class="card-badge ' + r.worst.toLowerCase() + '">' + r.worst + '</span>' +
      '<div class="card-info">' +
        '<div class="card-label">' + r.label + '</div>' +
        '<div class="card-text">' + r.text + '</div>' +
        '<div class="card-meta">' + r.page + ' &middot; ' + failDevices + '/' + r.devices.length + ' devices</div>' +
      '</div>' +
    '</div>';
  }).join("");

  cardsEl.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      selectedIdx = parseInt(card.dataset.idx);
      deviceIdx = 0;
      syncSelectedCard();
      renderDetail();
    });
  });

  if (selectedIdx !== null) {
    syncSelectedCard();
    renderDetail();
  }
  else {
    viewportEl.innerHTML = '<div class="viewport-empty">Select a check to see<br/>how it renders on each device</div>';
    deviceBarEl.innerHTML = "";
    titleEl.textContent = "Click a check to preview";
    deviceLabelEl.textContent = "";
    prevBtn.disabled = true;
    nextBtn.disabled = true;
  }
}

function renderDetail() {
  const list = filtered();
  const check = list[selectedIdx];
  if (!check) return;

  syncSelectedCard();
  titleEl.textContent = check.label;
  const nextSelectionKey = selectionKey(check);

  const dev = check.devices[deviceIdx];
  prevBtn.disabled = deviceIdx === 0;
  nextBtn.disabled = deviceIdx === check.devices.length - 1;
  const devInputType = inputTypeForWidth(dev.width);
  deviceLabelEl.innerHTML = dev.name + " (" + dev.width + "px)" +
    '<span class="device-type-badge ' + devInputType + '">' +
    (devInputType === "touch" ? "Touch" : "Mouse") + '</span>';

  updateViewportFrame(check, dev);

  const pageChanged = currentFramePage !== check.page;
  const checkChanged = currentCheckKey !== nextSelectionKey;

  if (pageChanged) {
    saveCurrentScrollPosition();
    currentFramePage = check.page;
    currentCheckKey = nextSelectionKey;
    frameEl.onload = () => {
      const restored = restoreScrollPosition(check.page);
      if (!restored || checkChanged) scrollCheckIntoView(check);
    };
    frameEl.src = TARGET + check.page;
  } else if (checkChanged) {
    currentCheckKey = nextSelectionKey;
    if (!scrollCheckIntoView(check)) restoreScrollPosition(check.page);
  }

  // Device bar
  deviceBarEl.innerHTML = check.devices.map((d, i) => {
    const color = d.status === "FAIL" ? "var(--fail)" : d.status === "WARN" ? "var(--warn)" : "var(--pass)";
    return '<button class="device-btn' + (i === deviceIdx ? ' active' : '') + '" data-i="' + i + '">' +
      '<span class="status-dot" style="background:' + color + '"></span>' +
      d.name +
    '</button>';
  }).join("");

  deviceBarEl.querySelectorAll(".device-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      deviceIdx = parseInt(btn.dataset.i);
      renderDetail();
    });
  });
}

// --- Keyboard nav ---
document.addEventListener("keydown", (e) => {
  const list = filtered();
  if (!list.length) return;

  if (e.key === "ArrowLeft" && selectedIdx !== null) {
    if (deviceIdx > 0) { deviceIdx--; renderDetail(); }
  } else if (e.key === "ArrowRight" && selectedIdx !== null) {
    const check = list[selectedIdx];
    if (deviceIdx < check.devices.length - 1) { deviceIdx++; renderDetail(); }
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (selectedIdx === null) { selectedIdx = 0; } else if (selectedIdx > 0) { selectedIdx--; }
    deviceIdx = 0; syncSelectedCard(); renderDetail();
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    if (selectedIdx === null) { selectedIdx = 0; } else if (selectedIdx < list.length - 1) { selectedIdx++; }
    deviceIdx = 0; syncSelectedCard(); renderDetail();
  } else if (e.key === "Escape") {
    selectedIdx = null; deviceIdx = 0; render();
  }
});

prevBtn.addEventListener("click", () => { if (deviceIdx > 0) { deviceIdx--; renderDetail(); } });
nextBtn.addEventListener("click", () => {
  const list = filtered();
  if (selectedIdx !== null && deviceIdx < list[selectedIdx].devices.length - 1) { deviceIdx++; renderDetail(); }
});

// --- Initial load: run measurement immediately ---
(async () => {
  try {
    runBtn.textContent = "Measuring...";
    runBtn.classList.add("running");
    const resp = await fetch("http://" + RUNNER + "/api/config");
    const config = await resp.json();
    await ensureFonts(config);
    data = runMeasurement(config);
    render();
  } catch (e) {
    countsEl.innerHTML = '<span style="color:var(--fail)">Start pretext-check first (port ' + RUNNER.split(":")[1] + ')</span>';
  }
  runBtn.textContent = "Generate Report";
  runBtn.classList.remove("running");
})();
</script>
