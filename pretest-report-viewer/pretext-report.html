<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Pretext Report</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#09090b;color:#e4e4e7;padding:2rem;max-width:900px;margin:0 auto}
  h1{font-size:1.25rem;margin-bottom:.25rem}
  .sub{color:#71717a;font-size:.8125rem;margin-bottom:1.5rem}
  .cards{display:flex;gap:.75rem;margin-bottom:1.5rem}
  .card{flex:1;background:#111;border:1px solid #222;border-radius:8px;padding:.75rem;text-align:center}
  .card .n{font-size:1.75rem;font-weight:700} .card .l{font-size:.625rem;color:#71717a;text-transform:uppercase;margin-top:.15rem}
  .card.pass .n{color:#4ade80} .card.warn .n{color:#facc15} .card.fail .n{color:#f87171}
  .section{margin-bottom:1rem}
  .section-title{font-size:.75rem;font-weight:600;color:#c9a84c;font-family:monospace;padding:.4rem 0;border-bottom:1px solid #1c1c22;margin-bottom:.5rem}
  .row{background:#111;border:1px solid #1c1c22;border-radius:6px;margin-bottom:.375rem;overflow:hidden}
  .row-head{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;font-size:.75rem}
  .badge{font-size:.5625rem;font-weight:700;text-transform:uppercase;padding:.1rem .4rem;border-radius:4px}
  .badge.pass{background:rgba(74,222,128,.1);color:#4ade80}
  .badge.warn{background:rgba(250,204,21,.1);color:#facc15}
  .badge.fail{background:rgba(248,113,113,.1);color:#f87171}
  .label{font-weight:500;color:#a1a1aa;flex:1}
  .text-preview{font-size:.6875rem;color:#3f3f50;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .devices{padding:.25rem .75rem .5rem;display:flex;flex-wrap:wrap;gap:.25rem}
  .dev{font-size:.625rem;padding:.2rem .4rem;border-radius:4px;border:1px solid #1c1c22;display:flex;align-items:center;gap:.35rem}
  .dev .dn{color:#71717a} .dev .dl{font-family:monospace;font-weight:600}
  .dev .dl.pass{color:#4ade80} .dev .dl.warn{color:#facc15} .dev .dl.fail{color:#f87171}
  .all-good{text-align:center;padding:2rem;color:#4ade80;font-size:.875rem}
  #loading{color:#71717a;font-size:.875rem}
</style>
</head><body>
<h1>Pretext Report</h1>
<p class="sub">10 checks &times; 9 breakpoints = 90 measurements</p>
<div id="loading">Loading fonts &amp; running checks...</div>
<div id="out"></div>
<script type="module">
import{prepare,layout}from"https://esm.sh/@chenglou/pretext@0.0.4";

const config = CONFIGJSON;

await Promise.all([
  document.fonts.load('400 16px "Cormorant Garamond"'),
  document.fonts.load('700 16px "Cormorant Garamond"'),
  document.fonts.load('500 16px Cinzel'),
  document.fonts.load('700 16px Cinzel'),
]);

let tp=0,tw=0,tf=0;
const results=[];

for(const ck of config.checks){
  const lh=ck.lineHeight||parseFloat(ck.fontSize)*1.4;
  const ml=ck.maxLines||1;
  const devs=[];
  for(const b of config.breakpoints){
    let fs=ck.fontSize;
    if(ck.responsive)for(const o of ck.responsive)if(b.width>=o.minWidth)fs=o.fontSize;
    const font=(ck.fontWeight||"400")+" "+fs+" "+ck.fontFamily;
    const cw=b.width-(ck.horizontalPadding||48);
    let lc=0,st="pass",tw2=0;
    try{
      const p=prepare(ck.text,font);
      if(ck.noWrap){
        const sl=layout(p,99999,lh);
        tw2=Math.round(sl.width||(parseFloat(fs)*ck.text.length*0.65));
        lc=1;
        st=tw2>cw?"fail":tw2>cw*0.9?"warn":"pass";
      }else{
        const r=layout(p,cw,lh);
        lc=r.lineCount;
        st=lc<=ml?"pass":lc<=ml+1?"warn":"fail";
      }
    }catch(e){st="fail";lc="?"}
    if(st==="pass")tp++;else if(st==="warn")tw++;else tf++;
    devs.push({name:b.name,width:b.width,fs,cw,lc,ml,st,noWrap:!!ck.noWrap,textWidth:tw2});
  }
  const worst=devs.some(d=>d.st==="fail")?"fail":devs.some(d=>d.st==="warn")?"warn":"pass";
  results.push({label:ck.label,text:ck.text,page:ck.page||"/",worst,devs});
}

// Sort failures first
results.sort((a,b)=>({fail:0,warn:1,pass:2}[a.worst])-({fail:0,warn:1,pass:2}[b.worst]));

// Group by page
const byPage={};
for(const r of results){if(!byPage[r.page])byPage[r.page]=[];byPage[r.page].push(r)}

const tot=tp+tw+tf;
let h='<div class="cards">';
h+='<div class="card"><div class="n">'+tot+'</div><div class="l">Total</div></div>';
h+='<div class="card pass"><div class="n">'+tp+'</div><div class="l">Pass</div></div>';
h+='<div class="card warn"><div class="n">'+tw+'</div><div class="l">Warn</div></div>';
h+='<div class="card fail"><div class="n">'+tf+'</div><div class="l">Fail</div></div>';
h+='</div>';

if(tf===0&&tw===0){
  h+='<div class="all-good">All '+tot+' checks passed across every breakpoint.</div>';
}

for(const[pg,checks]of Object.entries(byPage)){
  h+='<div class="section"><div class="section-title">'+pg+'</div>';
  for(const r of checks){
    const broken=r.devs.filter(d=>d.st!=="pass");
    h+='<div class="row"><div class="row-head"><span class="badge '+r.worst+'">'+r.worst.toUpperCase()+'</span><span class="label">'+r.label+'</span><span class="text-preview">&ldquo;'+r.text+'&rdquo;</span></div>';
    if(broken.length>0){
      h+='<div class="devices">';
      for(const d of broken){
        const metric=d.noWrap?d.textWidth+'/'+d.cw+'px':d.lc+'/'+d.ml+' lines';
        h+='<div class="dev"><span class="dn">'+d.name+' ('+d.width+'px)</span><span class="dl '+d.st+'">'+metric+'</span><span style="color:#3f3f50;font-size:.5625rem">'+d.fs+' in '+d.cw+'px</span></div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  h+='</div>';
}

document.getElementById('loading').style.display='none';
document.getElementById('out').innerHTML=h;

// Also dump to console for easy copy
console.table(results.flatMap(r=>r.devs.filter(d=>d.st!=="pass").map(d=>({check:r.label,page:r.page,device:d.name,width:d.width,fontSize:d.fs,container:d.cw,lines:d.lc+"/"+d.ml,status:d.st}))));
</script>
</body></html>
